# gera a cobrinha que come o gráfico de contribuições e publica na branch "output"
name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff2e4d&color_dots=#161b22,#3a0d14,#7a1626,#c21e38,#ff2e4d
            dist/snake-light.svg?color_snake=#ff2e4d&color_dots=#ebedf0,#ffc9d1,#ff8a9c,#ff4d68,#c21e38

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
