<text x="450.0" y="308" class="t3" text-anchor="middle">“quase se tocam — e é nesse espaço que tudo é criado.”</text>
<text x="450.0" y="334" class="t4" text-anchor="middle">$ ping adam  →  64 bytes from adam: icmp_seq=1 ttl=∞ time=0.0001 ms  <tspan class="red">(distância: nunca zero)</tspan></text>
