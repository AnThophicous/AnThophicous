<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="Brenno Leon de Souza Amaral — Front-end e Web Designer">
<title>Brenno Leon de Souza Amaral — Front-end e Web Designer</title>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#16161f" stroke-width="1"/>
  </pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#07070b" stop-opacity="1"/>
    <stop offset="1" stop-color="#07070b" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  text { font-family: 'JetBrains Mono','Fira Code','DejaVu Sans Mono',Menlo,Consolas,'Courier New',monospace; }
  .name { font-size: 46px; font-weight: 700; fill: #f2f2f7; letter-spacing: 1px; }
  .role { font-size: 16px; fill: #ff2e4d; letter-spacing: 2px; }
  .meta { font-size: 14px; fill: #7b7b90; }
  .tag  { font-size: 13px; fill: #d8d8e6; }
